<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local PII Document Scanner</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #172033; background: #f4f6fb; }
    * { box-sizing: border-box; }
    body { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    h1 { margin-bottom: 4px; font-size: 2rem; }
    .subtle { color: #596579; margin-top: 0; }
    .card { background: white; border: 1px solid #dce2ed; border-radius: 12px; padding: 22px; margin: 20px 0; box-shadow: 0 4px 16px #15294a0b; }
    input, button { font: inherit; }
    input[type=file] { display: block; margin: 12px 0 18px; max-width: 100%; }
    button { border: 0; border-radius: 8px; padding: 10px 18px; color: white; background: #2856c5; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f6f8fc; border-radius: 8px; padding: 16px; margin: 10px 0 0; }
    details { margin-top: 14px; }
    #error { color: #a32626; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Local PII Document Scanner</h1>
  <p class="subtle">Upload a document to extract text, find likely personal information, and redact it. Processing stays on this computer; no LLM API is used.</p>

  <section class="card">
    <form id="upload-form">
      <label for="file">Choose a text document, PDF, Office document, or image (up to 25 MB)</label>
      <input id="file" name="file" type="file" accept=".txt,.md,.csv,.pdf,.docx,.pptx,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp" required>
      <button id="submit" type="submit">Scan file</button>
      <p id="error" role="alert" hidden></p>
    </form>
  </section>

  <section id="results" hidden>
    <div class="card"><h2>Detection summary</h2><pre id="report"></pre></div>
    <div class="card"><h2>Redacted text</h2><pre id="redacted"></pre></div>
    <div class="card"><details><summary>Audit details</summary><pre id="audit"></pre></details></div>
  </section>

  <script>
    const form = document.querySelector('#upload-form');
    const fileInput = document.querySelector('#file');
    const button = document.querySelector('#submit');
    const error = document.querySelector('#error');
    const results = document.querySelector('#results');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;
      if (file.size > 25 * 1024 * 1024) {
        error.textContent = 'Please choose a file smaller than 25 MB.';
        error.hidden = false;
        return;
      }
      button.disabled = true;
      button.textContent = 'Scanning…';
      error.hidden = true;
      results.hidden = true;
      try {
        const response = await fetch('/api/process', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/octet-stream',
            'X-Filename': encodeURIComponent(file.name)
          },
          body: file
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not scan this file.');
        document.querySelector('#report').textContent = data.report;
        document.querySelector('#redacted').textContent = data.redacted_text;
        document.querySelector('#audit').textContent = JSON.stringify(data.audit, null, 2);
        results.hidden = false;
      } catch (err) {
        error.textContent = err.message;
        error.hidden = false;
      } finally {
        button.disabled = false;
        button.textContent = 'Scan file';
      }
    });
  </script>
</body>
</html>
